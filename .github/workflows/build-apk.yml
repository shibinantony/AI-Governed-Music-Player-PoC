name: Build Production Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build, Optimize & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release & Debug APKs
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Rename Output APKs for Direct Download
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} dist/BraveMusic-v1.0.3-release.apk \;
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} dist/BraveMusic-v1.0.3-debug.apk \;

      - name: Upload Release APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BraveMusic-Release-APK
          path: dist/*.apk
          retention-days: 30

      - name: Publish Direct Release Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.3
          name: "BraveMusic v1.0.3 (Total Ad-Shielding & Persistent Background Engine)"
          body: |
            ### 🎵 AI-Governed Shielded Audio Player (Brave Music v1.0.3)
            **Optimized for Samsung Galaxy S24 FE (Android 16 / One UI 8.5)**

            #### 🚀 Crucial Fixes & Architectural Upgrades in v1.0.3:
            - 🛡️ **Total Ad-Shielding (YouTubei API Purger + Fetch/XHR Proxy):** Intercepts all `/youtubei/v1/player` and `/youtubei/v1/next` responses and purges `adPlacements`, `playerAds`, and `adSlots` from memory before YouTube's player ever parses them. Drops `googlevideo` ad-segment streams.
            - ⚡ **Document-Start Script Injection:** Injects shield code synchronously at document creation (`WebViewCompat.addDocumentStartJavaScript`) before any YouTube scripts or ad modules can register.
            - 📱 **True Screen-Off Playback (`BackgroundWebView`):** Custom WebView overriding Chromium's `RenderWidgetHostViewAndroid` visibility signals (`onWindowVisibilityChanged`), permanently preventing media engine suspension when the screen turns off.
            - 🎚️ **Studio 5-Band Equalizer & Bass Booster:** Full WebAudio parametric equalizer with presets (*Flat, Bass Booster, EDM, Rock, Pop, Vocal, Hip-Hop, Classical*).

            #### 📥 Download & Install:
            Download **`BraveMusic-v1.0.3-release.apk`** below, tap to install, and enjoy ad-free, screen-off music playback!
          files: |
            dist/BraveMusic-v1.0.3-release.apk
            dist/BraveMusic-v1.0.3-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
