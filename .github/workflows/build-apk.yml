name: Build Production Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build, Optimize & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release & Debug APKs
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Rename Output APKs for Direct Download
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} dist/BraveMusic-v1.0.4-release.apk \;
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} dist/BraveMusic-v1.0.4-debug.apk \;

      - name: Upload Release APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BraveMusic-Release-APK
          path: dist/*.apk
          retention-days: 30

      - name: Publish Direct Release Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.4
          name: "BraveMusic v1.0.4 (Google Sign-In Fix & Jitter-Free Audio-Only Engine)"
          body: |
            ### 🎵 AI-Governed Shielded Audio Player (Brave Music v1.0.4)
            **Optimized for Samsung Galaxy S24 FE (Android 16 / One UI 8.5)**

            #### 🚀 Highlights & Fixes in v1.0.4:
            - ⌨️ **Google Sign-In & IME Keyboard Fixed:** Restored standard window focus hierarchy and input connection delegation (`BackgroundWebView`), allowing Samsung Keyboard and Gboard to bind instantly for seamless account login.
            - 🎶 **Pure Audio-Only Mode (Zero Stutter):** Completely detached video frame rasterization in WebView, freeing 100% of GPU/CPU for buttery-smooth, uncompressed 256kbps audio playback without any disturbance or jitter.
            - 🛡️ **Total Ad-Shielding:** Pre-DOM YouTubei API network purger stripping ad manifests (`adPlacements`, `playerAds`, `adSlots`) before player parsing.
            - 📱 **True Screen-Off Background Play:** Persistent background audio with lock-screen MediaSession controls and Studio 5-Band Equalizer.

            #### 📥 Download & Install:
            Download **`BraveMusic-v1.0.4-release.apk`** below, tap to install, and enjoy ad-free audio streaming!
          files: |
            dist/BraveMusic-v1.0.4-release.apk
            dist/BraveMusic-v1.0.4-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
