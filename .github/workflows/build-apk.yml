name: Build Production Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build, Optimize & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release & Debug APKs
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Rename Output APKs for Direct Download
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} dist/BraveMusic-v1.0.2-release.apk \;
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} dist/BraveMusic-v1.0.2-debug.apk \;

      - name: Upload Release APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BraveMusic-Release-APK
          path: dist/*.apk
          retention-days: 30

      - name: Publish Direct Release Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.2
          name: "BraveMusic v1.0.2 (True Background Playback & Studio Equalizer)"
          body: |
            ### 🎵 AI-Governed Shielded Audio Player (Brave Music v1.0.2)
            **Optimized for Samsung Galaxy S24 FE (Android 16 / One UI 8.5)**

            #### 🚀 What's New in v1.0.2:
            - 🛡️ **True Background Playback (Brave Browser Engine):** Overridden Page Visibility API (`document.visibilityState`, `document.hidden`) and neutralized event traps (`visibilitychange`, `pagehide`, `blur`) — music plays continuously when the screen is locked/turned off.
            - 🎚️ **Studio-Grade 5-Band Equalizer:** Built-in WebAudio DSP biquad filter chain (`60Hz`, `230Hz`, `910Hz`, `3.6kHz`, `14kHz`), dedicated **Bass Booster**, preamp gain, and 8 instant presets (*Flat, Bass Booster, EDM, Rock, Pop, Vocal, Hip-Hop, Classical*).
            - 🔋 **Enhanced WifiLock & WakeLock:** Prevents Samsung One UI aggressive network sleep from interrupting background streaming.
            - 📱 **Google OAuth & AMOLED Black:** Retained Samsung S24 FE Android 16 Chrome 134 User-Agent and `#000000` AMOLED dark theme.

            #### 📥 Download & Install:
            Download **`BraveMusic-v1.0.2-release.apk`** below, tap to install, and grant notification permission.
          files: |
            dist/BraveMusic-v1.0.2-release.apk
            dist/BraveMusic-v1.0.2-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
