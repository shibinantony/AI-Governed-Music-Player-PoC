name: Build Production Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build, Optimize & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release & Debug APKs
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Rename Output APKs for Direct Download
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} dist/BraveMusic-v1.0.1-release.apk \;
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} dist/BraveMusic-v1.0.1-debug.apk \;

      - name: Upload Release APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BraveMusic-Release-APK
          path: dist/*.apk
          retention-days: 30

      - name: Publish Direct Release Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.1
          name: "BraveMusic v1.0.1 (Samsung S24 FE / Android 16 & One UI 8.5)"
          body: |
            ### 🎵 AI-Governed Shielded Audio Player (Brave Music)
            **Optimized for Samsung Galaxy S24 FE (Android 16 / One UI 8.5)**

            #### 🚀 Highlights:
            - **Targeted for Android 16 & One UI 8.5:** Upgraded User-Agent profile (`Chrome 134.x / Android 16 / SM-S711B`) ensuring flawless Google OAuth sign-in and token persistence.
            - **Ad-Free Stream & Shielding:** In-memory request interception dropping AdSense, DoubleClick, and video mid-rolls.
            - **Lock-Screen Controls:** Real-time MediaSession notification controls with high-res artwork.
            - **Built-in Sleep Timer:** Smooth 30-second exponential audio fade-out ($V(t) = e^{3(t-1)}$).
            - **Pure AMOLED Black UI:** `#000000` theme saving battery on Dynamic AMOLED 2X displays.

            #### 📥 Download & Install:
            Download **`BraveMusic-v1.0.1-release.apk`** below, tap to install, and grant notification permission.
          files: |
            dist/BraveMusic-v1.0.1-release.apk
            dist/BraveMusic-v1.0.1-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
